name: Auto PR Description

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  generate-description:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get diff
        run: |
          git fetch origin "${{ github.base_ref }}"
          # GITHUB_ENV に載せると環境変数が巨大化し Node 起動で Argument list too long になるためファイルのみ
          git diff "origin/${{ github.base_ref }}" -- . | head -c 51200 > diff.txt || true

      - name: Generate PR Body
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let diff = '';
            try {
              diff = fs.readFileSync('diff.txt', 'utf8');
            } catch {
              diff = '(diff を取得できませんでした)';
            }
            const excerpt = diff.substring(0, 3000);

            const body = `## 概要
このPRは以下の変更を含みます。

## 変更内容
\`\`\`diff
${excerpt}
\`\`\`

## 変更理由
-

## 動作確認
-

## 影響範囲
-
`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: body
            });
